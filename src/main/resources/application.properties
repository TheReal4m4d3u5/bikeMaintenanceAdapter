spring.application.name=bike-maintenance-adapter

# Select one compatible maintenance repository family:
# memory | sql | graphql
app.repository.provider=memory

# SQL provider configuration
app.sql.url=${BIKE_SQL_URL:jdbc:postgresql://localhost:5432/bike_maintenance}
app.sql.username=${BIKE_SQL_USERNAME:postgres}
app.sql.password=${BIKE_SQL_PASSWORD:postgres}
app.sql.driver-class-name=${BIKE_SQL_DRIVER:org.postgresql.Driver}

# Separate remote GraphQL provider
app.graphql-provider.url=${BIKE_GRAPHQL_PROVIDER_URL:http://localhost:8090/graphql}
app.graphql-provider.token=${BIKE_GRAPHQL_PROVIDER_TOKEN:}

spring.graphql.graphiql.enabled=true
app.seed-data=true

app.security.jwt-secret=${JWT_SECRET:YmlrZS1tYWludGVuYW5jZS1kZXYtc2VjcmV0LWtleTE=}
app.security.jwt-expiration-minutes=60
app.security.jwt-issuer=bike-maintenance-adapter

# The application creates SQL infrastructure only when app.repository.provider=sql.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
